[project]
name = "evaluator"
version = "0.1.0"
description = "F5-01: evaluaciones online sobre las llamadas a modelos del portafolio."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "argus-obs-sdk>=1.0,<2",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pydantic>=2.9",
    "synaptum[axonium]>=1.0.0rc6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluator"]
