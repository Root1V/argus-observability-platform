[project]
name = "diagnose"
version = "0.1.0"
description = "L3: diagnostico de un incidente sobre contexto pre-recolectado."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "argus-obs-schemas>=1.0,<2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diagnose"]
