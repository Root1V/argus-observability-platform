[project]
name = "canary"
version = "0.1.0"
description = "Sondas sinteticas: convierte el silencio en una alerta."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "argus-schemas>=1.0,<2",
    "argus-sdk>=1.0,<2",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canary"]
