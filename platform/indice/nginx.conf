# El indice de paquetes. Solo sirve ficheros.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # `autoindex off` a proposito: los listados los genera
    # scripts/construir_indice.py con los fragmentos `#sha256=`, y el listado
    # automatico de nginx NO los lleva. Servir el automatico haria que pip
    # descargase sin verificar, en silencio.
    autoindex off;

    location / {
        try_files $uri $uri/index.html =404;
    }

    location = /salud {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
