apiVersion: 1

providers:
  - name: Argus
    orgId: 1
    folder: Argus
    type: file
    disableDeletion: false
    # Los dashboards son CODIGO: se editan en el repositorio, no en la UI.
    # Editarlos en la UI produce cambios que nadie revisa y que se pierden al
    # migrar de maquina.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
