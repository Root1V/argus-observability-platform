# =============================================================================
# Collector GATEWAY — el plano central. Uno solo.
#
# Aqui vive todo lo que necesita ver el conjunto: redaccion de PII,
# pseudonimizacion, tail sampling y el reparto a los almacenes.
#
# DECISION CLAVE: fan-out, no routing.
#
# Lo natural pareceria enrutar los spans GenAI a Langfuse y el resto a
# ClickHouse. Es un error: el `routing` connector con `context: span` separa
# spans del MISMO trace hacia tuberias distintas, asi que el span `chat qwen`
# se iria a Langfuse y su padre HTTP a ClickHouse, dejando la traza de
# ClickHouse con un hueco. Y reconstruir ese arbol completo es justo lo que el
# agente de RCA necesita para poder decir "esta latencia de LLM causo aquel
# timeout".
#
# Por eso: ClickHouse recibe la traza COMPLETA, Langfuse solo el subarbol
# GenAI, y los trace_id son identicos en ambos lados. Deep-link gratis.
#
# La rama de Langfuse vive en el overlay `gateway.genai.yaml`, que solo se
# carga cuando Langfuse esta desplegado. Un exportador apuntando a un host
# inexistente reintenta cada pocos segundos y llena el log de avisos: es
# exactamente el ruido que te ensena a ignorar los logs.
# =============================================================================

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  file_storage/queue:
    directory: /var/lib/argus/gateway-queue
    create_directory: true
    timeout: 10s

  # Valida el token que ponen los agentes.
  bearertokenauth/server:
    scheme: Bearer
    token: ${env:ARGUS_GATEWAY_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        auth:
          authenticator: bearertokenauth/server
        max_recv_msg_size_mib: 32
        keepalive:
          server_parameters:
            max_connection_idle: 11s
            max_connection_age: 30s
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth/server


  # El Collector se mide a si mismo. Expone sus metricas en :8888 desde el
  # principio, pero NADIE las recogia: por eso el agente pudo tirar el 100% de
  # lo que le mandaban durante dos dias sin que nada avisara (D-079). Un plano
  # de observabilidad que no se observa a si mismo no puede distinguir
  # "no pasa nada" de "no me esta llegando nada".
  prometheus/interno:
    config:
      scrape_configs:
        - job_name: otelcol
          scrape_interval: 15s
          static_configs:
            - targets: [127.0.0.1:8888]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  resource/gateway:
    attributes:
      # `insert`, NO `upsert`: el gateway ve pasar la telemetria del agente,
      # incluidas las metricas internas del propio agente. Con `upsert` les
      # sellaba encima su propio nivel, y entonces NADA en el almacen llevaba
      # `tier=agent` — asi que la regla que vigila si el agente ha enmudecido
      # se disparaba siempre, incluso con el agente sano (D-079). Un
      # detector que grita siempre es tan inutil como uno que no grita nunca.
      - key: argus.collector.tier
        value: gateway
        action: insert
      # Un servicio que emite sin declararse aparece igualmente, como
      # provisional. Descubrir sin avisar llena el registro de basura; avisar
      # sin descubrir lo deja vacio. Hacemos las dos cosas.
      - key: service.namespace
        value: unregistered
        action: insert

  # --- Privacidad, capa 2 ----------------------------------------------------
  # Red de seguridad por regex. La capa 1 esta en la aplicacion (el `mask` del
  # SDK). Esta segunda es la que importa de verdad: significa que un fallo de
  # instrumentacion en una app no se convierte en una fuga en el almacen.
  #
  # Lo que deliberadamente NO va aqui: NER con modelos. Demasiado caro para el
  # camino caliente. El Collector hace regex; los modelos van en proceso.
  redaction:
    allow_all_keys: true

    # Los atributos de IDENTIDAD nunca se redactan.
    #
    # Esto no es una comodidad: sin ello, cualquier aplicacion cuyo nombre o
    # version contenga una tirada de digitos acaba con su `service.namespace`
    # enmascarado, y entonces no se puede agrupar por aplicacion ni enrutar la
    # notificacion a su dueno. Lo descubrimos con la prueba de humo: un
    # namespace terminado en un numero de diez cifras se convertia en
    # `smoke-****` porque encajaba con el patron de telefono.
    ignored_keys:
      - service.name
      - service.namespace
      - service.version
      - service.instance.id
      - deployment.environment.name
      - argus.app
      - argus.component.role
      - argus.event
      - argus.run.id
      - error.type
      - gen_ai.request.model
      - gen_ai.response.model
      - gen_ai.provider.name
      - gen_ai.operation.name
      - langfuse.environment
      - langfuse.release
      - http.route
      - url.path

    blocked_values:
      - '\b[\w.+-]+@[\w-]+\.[\w.-]+\b'                          # email
      - '\b(?:\d[ -]*?){13,19}\b'                               # tarjeta
      # Telefono: EXIGE separadores o prefijo internacional. Una tirada suelta
      # de diez digitos es casi siempre un identificador, un timestamp o un
      # contador, no un telefono. Redactarla destruye datos utiles y no protege
      # nada.
      - '\+\d{1,3}[-.\s]\d{2,4}[-.\s]\d{2,4}[-.\s]?\d{0,4}'    # telefono internacional
      - '\b\d{3}[-.\s]\d{3}[-.\s]\d{4}\b'                     # telefono con separadores
      - '\b\d{8}[A-HJ-NP-TV-Z]\b'                               # DNI
      - '\b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b'                      # IBAN
      - '(?i)\b(?:sk|pk)-[A-Za-z0-9_\-]{16,}'                   # claves
      - '(?i)\bBearer\s+[A-Za-z0-9_\-.]{16,}'                   # tokens
    # Emite el conteo de redacciones. Es una metrica util por si misma: un pico
    # significa que alguna aplicacion empezo a filtrar PII.
    summary: debug

  # --- Privacidad, capa 3 ----------------------------------------------------
  # Pseudonimizacion. El agente puede agrupar "el mismo usuario" sin saber
  # quien es.
  # Seudonimizacion: el identificador de persona se HASHEA, no se borra.
  #
  # La diferencia importa. Borrarlo hace imposible preguntar "¿le pasa a un
  # usuario o a todos?", que es de las primeras preguntas de cualquier
  # investigacion. Hashearlo con sal conserva la agrupacion —el mismo usuario
  # da el mismo hash— sin que el almacen sepa quien es.
  #
  # La sal vive en el entorno del gateway y NO en el repositorio: sin ella el
  # hash de un UUID conocido seria comprobable por fuerza bruta.
  #
  # Se cubren las dos grafias a proposito. Las convenciones de OTel usan puntos
  # (`user.id`), pero el trafico real trae guiones bajos: Prometheus manda
  # `user_id` y `jwt.subject`, y ambos llegaban EN CRUDO a ClickHouse hasta que
  # esto existio. Una regla que solo cubre la grafia canonica protege de la
  # telemetria que escribes tu y no de la que recibes.
  transform/pseudonymize:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(span.attributes, "http.request.header.authorization")
          - delete_key(span.attributes, "url.query")
          # El hash va a `enduser.pseudo.id`, que es el nombre que el estandar
          # tiene EXACTAMENTE para esto, y el original se borra.
          #
          # Antes se hasheaba EN SITIO: el span salia con
          # `user.id = <64 hex>`, que no es un identificador de usuario. El
          # atributo prometia una cosa y contenia otra, y quien lo leyera
          # —persona o agente de RCA— concluiria que ese es el id (D-086).
          #
          # Precedencia explicita: si un span trae dos de las cuatro grafias,
          # gana la primera y las demas no sobreescriben. Sin esto, dos fuentes
          # distintas pelearian por el mismo destino segun el orden de llegada.
          - set(span.attributes["enduser.pseudo.id"], SHA256(Concat([span.attributes["user.id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where span.attributes["user.id"] != nil
          - set(span.attributes["enduser.pseudo.id"], SHA256(Concat([span.attributes["user_id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where span.attributes["user_id"] != nil and span.attributes["enduser.pseudo.id"] == nil
          - set(span.attributes["enduser.pseudo.id"], SHA256(Concat([span.attributes["enduser.id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where span.attributes["enduser.id"] != nil and span.attributes["enduser.pseudo.id"] == nil
          - set(span.attributes["enduser.pseudo.id"], SHA256(Concat([span.attributes["jwt.subject"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where span.attributes["jwt.subject"] != nil and span.attributes["enduser.pseudo.id"] == nil
          - delete_key(span.attributes, "user.id")
          - delete_key(span.attributes, "user_id")
          - delete_key(span.attributes, "enduser.id")
          - delete_key(span.attributes, "jwt.subject")
          # `session.id` se queda hasheado en sitio: no hay un
          # `session.pseudo.id` en el estandar, y una sesion no es una persona.
          - set(span.attributes["session.id"], SHA256(Concat([span.attributes["session.id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where span.attributes["session.id"] != nil
          # El correo se BORRA, no se hashea: no aporta agrupacion que el
          # seudonimo no de ya, y es dato personal directo.
          - delete_key(span.attributes, "user.email")
          - delete_key(span.attributes, "user_email")
          # Misma regla del objeto-principal que abajo, por si el emisor pone
          # el target en el span en vez de en el evento.
          - set(span.attributes["argus.target.id"], SHA256(Concat([span.attributes["argus.target.id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where span.attributes["argus.target.type"] == "user"
          - set(span.attributes["argus.target.id"], SHA256(Concat([span.attributes["argus.target.id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where span.attributes["argus.target.type"] == "client"
          # EL INQUILINO PUEDE SER UNA PERSONA.
          #
          # Lo encontro Prometheus sin buscarlo. Pidieron que verificaramos el
          # seudonimo de su objetivo, y en el mismo evento estaba esto:
          #
          #   enduser.pseudo.id = 9b154d1bde62…   el actor, protegido
          #   argus.tenant      = d2e0e23d-8599…  EL MISMO SUJETO, en claro
          #
          # Comprobado hasheando el valor con nuestra sal: da exactamente el
          # seudonimo de al lado. O sea que la seudonimizacion del actor queda
          # anulada DENTRO DEL MISMO EVENTO, dos campos mas alla.
          #
          # Es la tercera vez con la misma forma —el ambito `spanevent`, el
          # tipo `client`, y ahora este— y la regla ya estaba escrita: un
          # seudonimo vale lo que vale el sitio menos protegido donde aparece
          # ese sujeto (D-108).
          #
          # Y es nuestro, no suyo: en `P-32` les dijimos que `argus.tenant` ya
          # llevaba el cliente, asi que retiraron un atributo propio para
          # usarlo. Hicieron exactamente lo que documentamos.
          #
          # Se hashea EN SITIO, como `session.id`: un inquilino seudonimizado
          # sigue siendo el inquilino y sigue agrupando, que es para lo que el
          # campo existe.
          - set(span.attributes["argus.tenant"], SHA256(Concat([span.attributes["argus.tenant"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where span.attributes["argus.tenant"] != nil
      # --- Los MISMOS atributos, pero en un EVENTO de span -----------------
      #
      # `context: span` NO alcanza los atributos de los eventos. Son un ambito
      # OTTL distinto, y hasta que esto existio un `user.id` colgado de un
      # evento aterrizaba EN CRUDO en ClickHouse mientras el del span salia
      # seudonimizado. Medido, no supuesto:
      #
      #   span    user.id -> enduser.pseudo.id = 4a573e50...   correcto
      #   evento  user.id -> usuario-en-el-evento              en crudo
      #
      # Importa aqui y no en abstracto porque el registro de auditoria de
      # Prometheus vive EXACTAMENTE ahi: el evento `audit.admin_action` cuelga
      # del span de servidor y lleva el actor en sus propios atributos. Les
      # dijimos en A-32 que mandaran `user.id` en crudo porque el gateway lo
      # convertiria; era cierto del span y falso del evento, que es donde lo
      # ponen (D-092).
      #
      # El correo SI lo cazaba el `redaction`, que si recorre los eventos:
      # llegaba como `****`. Aun asi se borra aqui, para que la clave no quede
      # como un fantasma que sugiere que hubo un correo y no dice cual.
      #
      # Se seudonimiza EN EL EVENTO, no se sube al span: un span de servidor
      # puede llevar varios eventos de auditoria con actores distintos, y
      # subirlos haria que el ultimo pisara a los demas.
      - context: spanevent
        statements:
          - set(spanevent.attributes["enduser.pseudo.id"], SHA256(Concat([spanevent.attributes["user.id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where spanevent.attributes["user.id"] != nil
          - set(spanevent.attributes["enduser.pseudo.id"], SHA256(Concat([spanevent.attributes["user_id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where spanevent.attributes["user_id"] != nil and spanevent.attributes["enduser.pseudo.id"] == nil
          - set(spanevent.attributes["enduser.pseudo.id"], SHA256(Concat([spanevent.attributes["enduser.id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where spanevent.attributes["enduser.id"] != nil and spanevent.attributes["enduser.pseudo.id"] == nil
          - set(spanevent.attributes["enduser.pseudo.id"], SHA256(Concat([spanevent.attributes["jwt.subject"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where spanevent.attributes["jwt.subject"] != nil and spanevent.attributes["enduser.pseudo.id"] == nil
          - delete_key(spanevent.attributes, "user.id")
          - delete_key(spanevent.attributes, "user_id")
          - delete_key(spanevent.attributes, "enduser.id")
          - delete_key(spanevent.attributes, "jwt.subject")
          - delete_key(spanevent.attributes, "user.email")
          - delete_key(spanevent.attributes, "user_email")
          # El OBJETO de la accion, cuando el objeto puede ser una persona.
          #
          # `argus.target.id` es opaco por definicion —un id de nodo, de
          # modelo, de descarga— salvo cuando lo que se administra es un
          # principal. Ahi mete un identificador de persona en un atributo que
          # ninguna regla de arriba mira.
          #
          # SON DOS TIPOS, NO UNO, y el segundo lo trajo Prometheus (P-33): el
          # mismo `client_id` aparece bajo `/users/{client_id}` —tipo `user`— y
          # bajo `/billing/clients/{client_id}/settings` —tipo `client`—. Con
          # solo `user` en la regla, el almacen acababa con el HASH de un
          # sujeto en una fila y su identificador EN CLARO en otra.
          #
          # Y eso no es medio problema: un seudonimo vale lo que vale el sitio
          # menos protegido donde aparece ese sujeto. La fila en claro deja sin
          # sentido a la hasheada sin necesidad de cruzar nada (D-098).
          #
          # La clasificacion es de la PLATAFORMA, no del emisor: basta con que
          # `client` pueda designar a una persona en UNA aplicacion para que
          # haya que hashearlo en todas, porque el almacen es compartido. La
          # lista vive en el modelo como `ARGUS_TARGET_TYPE_PRINCIPALS` y una
          # prueba comprueba que esta enumeracion coincide con ella.
          - set(spanevent.attributes["argus.target.id"], SHA256(Concat([spanevent.attributes["argus.target.id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where spanevent.attributes["argus.target.type"] == "user"
          - set(spanevent.attributes["argus.target.id"], SHA256(Concat([spanevent.attributes["argus.target.id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where spanevent.attributes["argus.target.type"] == "client"
          - set(spanevent.attributes["argus.tenant"], SHA256(Concat([spanevent.attributes["argus.tenant"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where spanevent.attributes["argus.tenant"] != nil

    log_statements:
      - context: log
        statements:
          - delete_key(log.attributes, "http.request.header.authorization")
          - set(log.attributes["enduser.pseudo.id"], SHA256(Concat([log.attributes["user.id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where log.attributes["user.id"] != nil
          - set(log.attributes["enduser.pseudo.id"], SHA256(Concat([log.attributes["user_id"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where log.attributes["user_id"] != nil and log.attributes["enduser.pseudo.id"] == nil
          - delete_key(log.attributes, "user.id")
          - delete_key(log.attributes, "user_id")
          # Mismo criterio que en trazas: el correo no viaja al almacen.
          - delete_key(log.attributes, "user.email")
          - delete_key(log.attributes, "user_email")
          # Nadie lo manda aqui hoy. Se cubre igual porque el hueco de D-092
          # fue exactamente eso: unos ambitos cubiertos y otros no.
          - set(log.attributes["argus.tenant"], SHA256(Concat([log.attributes["argus.tenant"], "${env:ARGUS_PSEUDONYM_SALT}"], ""))) where log.attributes["argus.tenant"] != nil

  # El sesgo del muestreo, escrito EN el dato.
  #
  # El tail sampling conserva el 100 % de los errores y el 10 % del resto, asi
  # que **cualquier proporcion entre spans con error y sin error leida de
  # `otel_traces` esta inflada unas diez veces**. No es hipotetico: el 13/09
  # concluimos que Prometheus sondeaba ocho veces mas a menudo un backend roto
  # que uno sano. Su bucle era uniforme; el sesgo era nuestro, y su equipo tuvo
  # que corregirnos con su propio codigo en la mano.
  #
  # Un agente de RCA leyendo esta tabla sacaria la misma conclusion equivocada,
  # y con mas seguridad que una persona. Asi que el factor viaja en el span: al
  # menos el sesgo es descubrible sin conocer esta configuracion.
  #
  # Las TASAS se sacan de `spanmetrics`, que se deriva antes de muestrear.
  transform/sampling_bias:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(span.attributes["argus.sampling.baseline_pct"], 10)

  # --- Muestreo --------------------------------------------------------------
  # AVISO: el tail sampling exige que TODOS los spans de una traza lleguen a la
  # MISMA instancia. Con un gateway unico es correcto. Al escalar a varios hace
  # falta una capa previa con `loadbalancing` exporter y routing_key: traceID,
  # o el muestreo se vuelve incorrecto EN SILENCIO.
  #
  # Y ojo: esta espera de 30 s es la razon por la que la deteccion NO pasa por
  # aqui. El camino caliente va directo del agente al alert-bus.
  tail_sampling:
    # 30 s es el presupuesto para que una traza HTTP normal cierre. NO es
    # suficiente para trabajo asincrono, y subirlo no arregla nada: un doblaje
    # tarda 21 minutos y nadie va a bufferizar 21 minutos de trazas en memoria.
    # Lo que arregla el caso asincrono es la politica `async-handoff` de abajo,
    # que decide con evidencia que SI llega dentro de la ventana (D-083).
    decision_wait: 30s
    num_traces: 100000
    expected_new_traces_per_sec: 500

    # Explicito y no por defecto, porque de esto depende que el caso asincrono
    # funcione: cuando una traza se marca para conservar, su decision tiene que
    # seguir en memoria 21 minutos despues, que es cuando cierra el span del
    # worker. Si la entrada se desaloja antes, el span tardio llega a un
    # gateway que ya no recuerda haber dicho que si.
    decision_cache:
      sampled_cache_size: 100000
      non_sampled_cache_size: 100000

    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]

      - name: marked-hot
        type: boolean_attribute
        boolean_attribute:
          key: argus.hot
          value: true

      - name: slow
        type: latency
        latency:
          threshold_ms: 3000

      # Todo lo GenAI se queda: es el corpus de evaluacion de Langfuse, y
      # muestrearlo hace inutiles las metricas de coste.
      - name: genai-always
        type: string_attribute
        string_attribute:
          key: gen_ai.operation.name
          values: [chat, text_completion, embeddings, generate_content, retrieval, execute_tool, invoke_agent, create_agent]

      # Las investigaciones del propio agente de RCA se conservan enteras: es
      # como se evalua si el agente mejora con el tiempo.
      - name: agent-runs
        type: string_attribute
        string_attribute:
          key: argus.investigation.id
          values: [".*"]
          enabled_regex_matching: true

      # --- El caso asincrono ---------------------------------------------
      # Una traza que publica en una cola NO se puede juzgar a los 30 segundos:
      # a esa altura solo se ha visto la peticion HTTP, que cierra en
      # milisegundos y no tiene nada interesante. El trabajo de verdad cierra
      # minutos u horas despues, cuando la suerte de la traza ya esta echada y
      # el span tardio se tira (D-083).
      #
      # La evidencia que SI llega a tiempo es el span del PRODUCTOR: lo crea la
      # instrumentacion de Celery en el proceso de la API, en el mismo
      # milisegundo que la peticion. Con el basta para saber que esta traza va
      # a continuar en otro sitio, y eso es exactamente lo que hay que decidir.
      #
      # Cuesta poco: medido sobre 7 dias, 5 de 8640 trazas tocan una cola
      # (0,06%). Y es el 0,06% que responde "por que tardo tanto esto", que es
      # la pregunta con la que justificamos el piloto entero.
      - name: async-handoff
        type: string_attribute
        string_attribute:
          key: messaging.destination
          values: [".*"]
          enabled_regex_matching: true

      # La grafia nueva de las semconv. Las instrumentaciones estan migrando de
      # `messaging.destination` a esta; tener las dos evita que una
      # actualizacion nos deje sin la politica y sin avisar.
      - name: async-handoff-semconv-nueva
        type: string_attribute
        string_attribute:
          key: messaging.destination.name
          values: [".*"]
          enabled_regex_matching: true

      # --- La auditoria NO se muestrea -----------------------------------
      #
      # Un registro de auditoria al 10% no es un registro de auditoria.
      #
      # Se descubrio midiendo: Prometheus adopto `argus.target.*` y ejecuto dos
      # acciones admin reales para que las verificaramos. Ninguna de las dos
      # llego al almacen. Ninguna politica de arriba aplica a un PATCH admin
      # —no falla, dura milisegundos, no toca cola, no es GenAI— asi que caian
      # al `baseline` del 10%, con un 81% de probabilidad de perderse las dos.
      #
      # El coste de equivocarse no es simetrico. Una traza normal perdida es
      # una muestra menos; una accion administrativa perdida es un hueco en el
      # registro de quien hizo que, que ademas el Anexo III del AI Act obliga a
      # conservar seis meses (D-098).
      #
      # `ottl_condition` y no `string_attribute` porque el evento de auditoria
      # vive en el AMBITO spanevent, y las politicas de atributo solo miran el
      # span. Es el mismo ambito que se nos escapo en la seudonimizacion.
      - name: auditoria
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          #
          # Los desenlaces de GOBIERNO van en los dos ambitos. Son registros
          # igual que una accion administrativa: `denied` dice que el sistema
          # se nego y `suspended` que un run espera a una persona. Los dos son
          # raros por construccion y los dos hay que poder reconstruirlos.
          #
          # Se anadieron tras medir que el consejo que le dimos a Aeon era
          # contraproducente: les recomendamos emitir `argus.outcome=denied`
          # SIN `argus.guardrail` —para no paginar en cada denegacion de
          # politica— y medir la tasa una semana. Con solo eso no aplicaba
          # ninguna politica: 0 de 8 denegaciones sobrevivieron al baseline en
          # la prueba (D-099).
          #
          # Cambiaba una notificacion de mas por un registro incompleto al
          # 90%, que es peor: el ruido se nota y un registro con huecos no.
          spanevent:
            - 'name == "audit.admin_action"'
            - 'attributes["argus.target.type"] != nil'
            - 'attributes["argus.outcome"] == "denied"'
            - 'attributes["argus.outcome"] == "suspended"'
          span:
            - 'attributes["argus.target.type"] != nil'
            - 'attributes["argus.outcome"] == "denied"'
            - 'attributes["argus.outcome"] == "suspended"'

      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  # --- Rama ClickHouse -------------------------------------------------------
  # Fuera el contenido de mensajes. En Langfuse el contenido ES el producto;
  # en ClickHouse son decenas de KB por span sin ninguna consulta que los use.
  attributes/strip_content:
    actions:
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.system_instructions
        action: delete
      - key: gen_ai.tool.call.arguments
        action: delete
      - key: gen_ai.tool.call.result
        action: delete

  batch/clickhouse:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

connectors:
  # Metricas RED derivadas de TODAS las trazas, antes de muestrear. Si se
  # derivaran despues, las metricas quedarian sesgadas por el muestreo.
  spanmetrics:
    histogram:
      explicit:
        buckets: [2ms, 8ms, 32ms, 128ms, 512ms, 1s, 4s, 16s, 64s]
    dimensions:
      - name: service.namespace
      - name: argus.component.role
      - name: http.request.method
      - name: http.route
      - name: error.type
      - name: gen_ai.operation.name
      # Las DOS, y el motivo importa. La convencion dice que el nombre del span
      # es `{operacion} {request.model}`, asi que un cliente que pida por un
      # alias produce un nombre distinto para el mismo modelo. Agregar por
      # `response.model` —lo que se sirvio de verdad— mantiene el eje estable
      # sin pedirle a nadie que se aparte del estandar (D-062).
      - name: gen_ai.request.model
      - name: gen_ai.response.model
    exemplars:
      enabled: true
    metrics_flush_interval: 10s

    # Una serie que deja de recibir spans deja de emitirse.
    #
    # Sin esto, `spanmetrics` mantiene y reemite cada serie que ha visto para
    # siempre. Medido: retire un agente de prueba y sus metricas seguian
    # apareciendo con marca de tiempo ACTUAL quince minutos despues, con el
    # contenedor borrado.
    #
    # Lo que eso rompe no es un panel: es cualquier cosa que cuente "que esta
    # vivo" a partir de estas metricas. Una aplicacion retirada, un host que
    # ya no existe o un endpoint que se dejo de servir parecen activos
    # indefinidamente — y "parece vivo" es justo lo que esta plataforma
    # existe para no creerse (D-104).
    #
    # 15 minutos: mas que cualquier intervalo de scrape y menos que la ventana
    # con la que se juzga si algo sigue ahi.
    metrics_expiration: 15m

exporters:
  # Base de datos `otel`, SEPARADA de la que usa Langfuse en la misma
  # ClickHouse: compartirla arriesga colisiones con sus migraciones.
  clickhouse:
    endpoint: ${env:ARGUS_CLICKHOUSE_DSN}
    database: otel
    create_schema: true
    ttl: 720h                    # 30 dias en caliente
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_tables:
      gauge:
        name: otel_metrics_gauge
      sum:
        name: otel_metrics_sum
      histogram:
        name: otel_metrics_histogram
    timeout: 10s
    sending_queue:
      enabled: true
      storage: file_storage/queue
      num_consumers: 10
      queue_size: 10000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  prometheusremotewrite:
    endpoint: ${env:ARGUS_VICTORIAMETRICS_ENDPOINT}
    target_info:
      enabled: true
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check, file_storage/queue, bearertokenauth/server]

  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info
      encoding: json

  pipelines:
    # Metricas RED derivadas ANTES de muestrear, para que no se sesguen.
    traces/metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [spanmetrics]

    # Traza COMPLETA a ClickHouse. Fuente de verdad del agente de RCA.
    traces/clickhouse:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource/gateway
        - redaction
        - transform/pseudonymize
        - transform/sampling_bias
        - tail_sampling
        - attributes/strip_content
        - batch/clickhouse
      exporters: [clickhouse]

    metrics:
      receivers: [otlp, spanmetrics, prometheus/interno]
      processors: [memory_limiter, resource/gateway, batch/clickhouse]
      exporters: [clickhouse, prometheusremotewrite]

    logs:
      receivers: [otlp]
      processors:
        - memory_limiter
        - resource/gateway
        - redaction
        - transform/pseudonymize
        - batch/clickhouse
      exporters: [clickhouse]
