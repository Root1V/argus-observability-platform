# =============================================================================
# Argus — plano central.
#
# Arranca en MODO LIGERO y crece por perfiles. El stack completo (ClickHouse +
# Langfuse con sus cuatro dependencias + Temporal + VictoriaMetrics + HyperDX)
# es demasiado para un portatil que ademas corre inferencia local.
#
#   docker compose --profile lean   up -d    # 4 contenedores. Fase 0
#   docker compose --profile genai  up -d    # + Langfuse. Fase 1
#   docker compose --profile agents up -d    # + Temporal. Fase 3
#
# PORTABILIDAD: todo el estado vive en volumenes NOMBRADOS, nunca en rutas
# absolutas del host. Migrar de la MacBook al iMac es exportar volumenes,
# restaurarlos y arrancar. Ese procedimiento se ensaya una vez en frio, en la
# Fase 0, antes de necesitarlo.
# =============================================================================

name: argus

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # PERFIL lean — lo minimo para tener logs, trazas, metricas y SQL
  # ---------------------------------------------------------------------------

  clickhouse:
    <<: *restart
    profiles: [lean, genai, agents, full]
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-argus}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?define CLICKHOUSE_PASSWORD en .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 9010 y no 9000: el puerto nativo de ClickHouse choca con MinIO y otros
      # servicios habituales. Dentro de la red de compose sigue siendo 9000.
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9010:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Metricas y reglas de alerta. VictoriaMetrics en vez de Prometheus: un solo
  # binario y mucha menos memoria, con PromQL compatible. En un portatil la
  # diferencia se nota.
  victoriametrics:
    <<: *restart
    profiles: [lean, genai, agents, full]
    image: victoriametrics/victoria-metrics:v1.111.0
    command:
      - --storageDataPath=/vm-data
      - --retentionPeriod=30d
      - --httpListenAddr=:8428
      # Deduplicacion corta: el mismo dato puede llegar por reintento del agente.
      - --dedup.minScrapeInterval=10s
    volumes:
      - vm-data:/vm-data
    ports:
      - "127.0.0.1:8428:8428"

  # Reglas de alerta. Intervalo de 10 s: es el presupuesto del camino TEMPLADO
  # (2-15 s). El camino caliente no pasa por aqui, va directo al alert-bus.
  # Indice de paquetes PEP 503. Estatico a proposito: son ficheros en un
  # volumen, asi que se mueve con el resto del plano central sin estado que
  # migrar. `devpi` entraria detras de esta misma URL el dia que haga falta
  # subida por twine o replica de PyPI — hoy no hace falta (D-075).
  indice:
    <<: *restart
    profiles: [lean, genai, agents, full]
    image: nginx:1.27-alpine
    volumes:
      - ./indice:/usr/share/nginx/html:ro
      - ./indice/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Solo en localhost. Desde otra maquina se llega por la red privada
      # (B-11), no abriendo el puerto al mundo.
      - "127.0.0.1:8081:80"

  vmalert:
    <<: *restart
    profiles: [lean, genai, agents, full]
    image: victoriametrics/vmalert:v1.111.0
    depends_on: [victoriametrics]
    command:
      - --datasource.url=http://victoriametrics:8428
      - --remoteWrite.url=http://victoriametrics:8428
      - --remoteRead.url=http://victoriametrics:8428
      - --notifier.url=http://alert-bus:8080
      # El alert-bus EXIGE token, y vmalert no lo mandaba. Cada alerta del
      # camino templado moria en un 401 que solo se veia en el log de vmalert:
      # las reglas se evaluaban, disparaban, y la notificacion se perdia. Se
      # descubrio porque no habia alertas que fallaran, no porque fallaran.
      - --notifier.bearerTokenFile=/run/secrets/argus_token
      - --rule=/rules/*.yaml
      # Relee las reglas sin reiniciar. Sin esto, anadir un fichero exige
      # `up -d --force-recreate`: un `restart` no basta, y eso hace que un
      # cambio de reglas parezca aplicado sin estarlo.
      - --configCheckInterval=30s
      - --evaluationInterval=10s
    volumes:
      - ./rules:/rules:ro
      - ./secrets/argus_token:/run/secrets/argus_token:ro

  # El Collector corre SIN privilegios (uid 10001), y un volumen nombrado nace
  # perteneciendo a root. Sin esto, la cola persistente no puede crearse y el
  # Collector entra en bucle de reinicio. Este init lo arregla una vez y sale.
  collector-init:
    profiles: [lean, genai, agents, full]
    image: busybox:1.37
    user: "0"
    command: ["sh", "-c", "mkdir -p /var/lib/argus/gateway-queue && chown -R 10001:10001 /var/lib/argus"]
    volumes:
      - collector-queue:/var/lib/argus
    restart: "no"

  collector:
    <<: *restart
    profiles: [lean, genai, agents, full]
    # Version FIJADA, nunca `:latest`. Y `contrib`, no `core`: clickhouse,
    # redaction, tail_sampling, spanmetrics y filestorage son todos de contrib.
    image: otel/opentelemetry-collector-contrib:0.140.0
    depends_on:
      clickhouse: { condition: service_healthy }
      collector-init: { condition: service_completed_successfully }
    # El overlay GenAI se anade solo cuando Langfuse esta desplegado. Se activa
    # con `ARGUS_COLLECTOR_CONFIGS` desde el .env, o usando compose.genai.yaml.
    command: ${ARGUS_COLLECTOR_CONFIGS:---config=/etc/otel/gateway.yaml}
    environment:
      # Sal de la seudonimizacion. Sin ella, el hash de un UUID conocido se
      # comprueba por fuerza bruta; con ella, el mismo usuario sigue dando el
      # mismo hash y la agrupacion se conserva.
      # CAMBIARLA reescribe todos los hashes futuros: los incidentes viejos
      # dejan de agrupar con los nuevos. Es una decision, no un ajuste.
      ARGUS_PSEUDONYM_SALT: ${ARGUS_PSEUDONYM_SALT:?define ARGUS_PSEUDONYM_SALT en .env}
      ARGUS_GATEWAY_TOKEN: ${ARGUS_GATEWAY_TOKEN:?define ARGUS_GATEWAY_TOKEN en .env}
      ARGUS_CLICKHOUSE_DSN: tcp://${CLICKHOUSE_USER:-argus}:${CLICKHOUSE_PASSWORD}@clickhouse:9000/otel?dial_timeout=10s&compress=lz4
      ARGUS_LANGFUSE_ENDPOINT: ${ARGUS_LANGFUSE_ENDPOINT:-http://langfuse-web:3000/api/public/otel}
      ARGUS_LANGFUSE_AUTH: ${ARGUS_LANGFUSE_AUTH:-}
      ARGUS_VICTORIAMETRICS_ENDPOINT: http://victoriametrics:8428/api/v1/write
    volumes:
      - ./collector/gateway.yaml:/etc/otel/gateway.yaml:ro
      - ./collector/gateway.genai.yaml:/etc/otel/gateway.genai.yaml:ro
      - collector-queue:/var/lib/argus
    ports:
      # 14317/14318 y no 4317/4318: en la maquina que aloja el plano central,
      # esos puertos son del Collector AGENTE. El invariante "las aplicaciones
      # exportan a localhost:4317" tiene que valer tambien aqui, o esta maquina
      # seria la excepcion que hay que recordar.
      # Al gateway solo lo alcanzan agentes, con endpoint configurable.
      - "14317:4317"     # OTLP/gRPC — llegan agentes de otras maquinas
      - "14318:4318"     # OTLP/HTTP
      - "127.0.0.1:13133:13133"
      - "127.0.0.1:8888:8888"
    # Sin healthcheck de contenedor: la imagen del Collector es distroless y no
    # trae wget, curl ni shell. La extension health_check sigue expuesta en
    # 13133 y se comprueba desde fuera (scripts/verify.sh), que es donde el
    # dato sirve de algo.

  # El receptor del CAMINO CALIENTE. Recibe spans filtrados del Collector
  # agente y decide si constituyen un incidente, sin tocar la base de datos.
  # Presupuesto: ~2 s del fallo al aviso.
  alert-bus:
    <<: *restart
    profiles: [lean, genai, agents, full]
    build:
      context: ..
      dockerfile: services/alert-bus/Dockerfile
    environment:
      ALERTBUS_TOKEN: ${ARGUS_GATEWAY_TOKEN:?define ARGUS_GATEWAY_TOKEN en .env}
      ALERTBUS_REGISTRY_PATH: /etc/argus/apps.yaml
      ALERTBUS_SINKS: ${ALERTBUS_SINKS:-console,json}
      # Canales reales. Se omiten con un aviso si no estan configurados: un
      # sink que falla en cada envio llena el log y da la falsa impresion de
      # que la plataforma esta avisando.
      ALERTBUS_GCHAT_WEBHOOK: ${ALERTBUS_GCHAT_WEBHOOK:-}
      ALERTBUS_TELEGRAM_TOKEN: ${ALERTBUS_TELEGRAM_TOKEN:-}
      ALERTBUS_TELEGRAM_CHAT_ID: ${ALERTBUS_TELEGRAM_CHAT_ID:-}
      ALERTBUS_TELEGRAM_API_BASE: ${ALERTBUS_TELEGRAM_API_BASE:-https://api.telegram.org}
      ALERTBUS_SMTP_HOST: ${ALERTBUS_SMTP_HOST:-}
      ALERTBUS_SMTP_PORT: ${ALERTBUS_SMTP_PORT:-587}
      ALERTBUS_SMTP_USER: ${ALERTBUS_SMTP_USER:-}
      ALERTBUS_SMTP_PASSWORD: ${ALERTBUS_SMTP_PASSWORD:-}
      ALERTBUS_SMTP_FROM: ${ALERTBUS_SMTP_FROM:-argus@localhost}
      ALERTBUS_SMTP_TO: ${ALERTBUS_SMTP_TO:-}
      # Gmail y la mayoria exigen STARTTLS; un SMTP local de pruebas no lo
      # soporta y falla con "STARTTLS extension not supported by server".
      ALERTBUS_SMTP_TLS: ${ALERTBUS_SMTP_TLS:-true}
      ALERTBUS_WHATSAPP_PHONE_ID: ${ALERTBUS_WHATSAPP_PHONE_ID:-}
      ALERTBUS_WHATSAPP_TOKEN: ${ALERTBUS_WHATSAPP_TOKEN:-}
      ALERTBUS_WHATSAPP_TO: ${ALERTBUS_WHATSAPP_TO:-}
      ALERTBUS_WHATSAPP_TEMPLATE: ${ALERTBUS_WHATSAPP_TEMPLATE:-argus_incidente}
      ALERTBUS_GROUP_WINDOW_S: ${ALERTBUS_GROUP_WINDOW_S:-60}
      ALERTBUS_RESOLVE_AFTER_S: ${ALERTBUS_RESOLVE_AFTER_S:-900}
      ALERTBUS_TICK_S: ${ALERTBUS_TICK_S:-5}
      ALERTBUS_DISPATCH_WORKERS: ${ALERTBUS_DISPATCH_WORKERS:-2}
      ALERTBUS_DISPATCH_QUEUE_SIZE: ${ALERTBUS_DISPATCH_QUEUE_SIZE:-1000}
      # Se observa a si mismo: seria absurdo que la pieza que detecta
      # incidentes fuera la unica sin telemetria.
      ARGUS_ENDPOINT: http://collector:4317
      ARGUS_ENVIRONMENT: ${ARGUS_ENVIRONMENT:-mac-dev}
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${ARGUS_GATEWAY_TOKEN}
    volumes:
      - ./registry/apps.yaml:/etc/argus/apps.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"

  # Sondas sinteticas. Convierte el SILENCIO en una alerta: sin esto, una
  # aplicacion caida no produce telemetria, y la ausencia de telemetria es
  # indistinguible de "va todo bien y no hay trafico".
  #
  # En macOS importa el doble: el nivel 0 del plan se apoyaba en eBPF, que es
  # del kernel Linux y aqui no existe.
  canary:
    <<: *restart
    profiles: [lean, genai, agents, full]
    build:
      context: ..
      dockerfile: services/canary/Dockerfile
    depends_on: [alert-bus]
    environment:
      CANARY_ALERTBUS_URL: http://alert-bus:8080
      CANARY_TOKEN: ${ARGUS_GATEWAY_TOKEN:?define ARGUS_GATEWAY_TOKEN en .env}
      CANARY_REGISTRY_PATH: /etc/argus/apps.yaml
      CANARY_PROBES_PATH: /etc/argus/probes.yaml
      CANARY_INTERVALO_S: ${CANARY_INTERVALO_S:-300}
      CANARY_CLICKHOUSE_URL: http://clickhouse:8123/
      CANARY_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-argus}
      CANARY_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      ARGUS_ENDPOINT: http://collector:4317
      ARGUS_ENVIRONMENT: ${ARGUS_ENVIRONMENT:-mac-dev}
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${ARGUS_GATEWAY_TOKEN}
    volumes:
      - ./registry/apps.yaml:/etc/argus/apps.yaml:ro
      - ./registry/probes.yaml:/etc/argus/probes.yaml:ro

  # Los dashboards. Responden "¿como va mi aplicacion?"; para "¿que paso en
  # ESTA peticion?" esta la vista de trazas, que es otra pregunta distinta.
  #
  # Fuentes de datos y dashboards PROVISIONADOS desde disco: un dashboard que
  # depende de que alguien configurara algo a mano hace seis meses es un
  # dashboard que se rompe al migrar de maquina.
  grafana:
    <<: *restart
    profiles: [lean, genai, agents, full]
    image: grafana/grafana:11.6.0
    depends_on: [victoriametrics, clickhouse]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?define GRAFANA_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # El conector de ClickHouse es un plugin; sin el, la tabla de trazas
      # queda vacia y el resto del dashboard sigue funcionando.
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-argus}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"

  # ---------------------------------------------------------------------------
  # PERFIL genai — Langfuse y sus dependencias
  # ---------------------------------------------------------------------------

  langfuse-postgres:
    <<: *restart
    profiles: [genai, agents, full]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?define LANGFUSE_DB_PASSWORD en .env}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      retries: 10

  langfuse-redis:
    <<: *restart
    profiles: [genai, agents, full]
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:?define LANGFUSE_REDIS_PASSWORD en .env}"]
    volumes:
      - langfuse-redis:/data

  # Almacenamiento S3-compatible. Langfuse v3 lo exige para persistir eventos.
  langfuse-minio:
    <<: *restart
    profiles: [genai, agents, full]
    # Desde quay.io y no Docker Hub: MinIO retiro sus imagenes de alli, y un
    # `pull access denied` sobre una imagen que existio no dice eso en ningun
    # sitio. Version fijada, como todas.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-argus}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?define MINIO_PASSWORD en .env}
    volumes:
      - langfuse-minio:/data
    ports:
      - "127.0.0.1:9011:9001"   # consola de MinIO; 9001 suele estar ocupado

  # Langfuse NO crea su bucket: espera encontrarlo. Sin esto, la ingesta OTLP
  # devuelve 500 y el error solo aparece en los logs de langfuse-web, no en los
  # del Collector, que se limita a reportar "HTTP 500".
  langfuse-minio-init:
    profiles: [genai, agents, full]
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on: [langfuse-minio]
    entrypoint: >
      sh -c "
      until mc alias set argus http://langfuse-minio:9000 '${MINIO_USER:-argus}' '${MINIO_PASSWORD}' 2>/dev/null; do sleep 2; done;
      mc mb --ignore-existing argus/langfuse;
      echo 'bucket langfuse listo'
      "
    restart: "no"

  langfuse-web:
    <<: *restart
    profiles: [genai, agents, full]
    image: langfuse/langfuse:3
    depends_on:
      langfuse-postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      langfuse-minio-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-postgres:5432/langfuse
      # Base `default`, SEPARADA de la `otel` del Collector: compartirla
      # arriesga colisiones con las migraciones de Langfuse.
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-argus}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      # Un solo nodo: sin esto Langfuse intenta crear tablas
      # replicadas, que exigen ZooKeeper/Keeper, y falla con un
      # error que habla de la base de datos y no de la replicacion.
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD}@langfuse-redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_USER:-argus}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      NEXTAUTH_URL: ${LANGFUSE_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?define LANGFUSE_NEXTAUTH_SECRET en .env}
      SALT: ${LANGFUSE_SALT:?define LANGFUSE_SALT en .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?define LANGFUSE_ENCRYPTION_KEY en .env}
      TELEMETRY_ENABLED: "false"
      # Provisionado sin pasar por la UI. Las claves salen del .env, asi que el
      # Collector puede autenticarse desde el primer arranque.
      LANGFUSE_INIT_ORG_ID: argus
      LANGFUSE_INIT_ORG_NAME: Argus
      LANGFUSE_INIT_PROJECT_ID: argus-portafolio
      LANGFUSE_INIT_PROJECT_NAME: Portafolio
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?define LANGFUSE_PUBLIC_KEY en .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?define LANGFUSE_SECRET_KEY en .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_EMAIL:-argus@argus.local}
      LANGFUSE_INIT_USER_NAME: Argus
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_PASSWORD:?define LANGFUSE_INIT_PASSWORD en .env}
    ports:
      - "127.0.0.1:3000:3000"

  langfuse-worker:
    <<: *restart
    profiles: [genai, agents, full]
    image: langfuse/langfuse-worker:3
    depends_on:
      langfuse-postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-argus}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      # Un solo nodo: sin esto Langfuse intenta crear tablas
      # replicadas, que exigen ZooKeeper/Keeper, y falla con un
      # error que habla de la base de datos y no de la replicacion.
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://:${LANGFUSE_REDIS_PASSWORD}@langfuse-redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_USER:-argus}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"

  # ---------------------------------------------------------------------------
  # PERFIL agents — Temporal, para los workflows de investigacion
  # ---------------------------------------------------------------------------

  temporal-postgres:
    <<: *restart
    profiles: [agents, full]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?define TEMPORAL_DB_PASSWORD en .env}
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      retries: 10

  temporal:
    <<: *restart
    profiles: [agents, full]
    image: temporalio/auto-setup:1.28
    depends_on:
      temporal-postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "127.0.0.1:7233:7233"

  temporal-ui:
    <<: *restart
    profiles: [agents, full]
    image: temporalio/ui:2.34.0
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8081
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  grafana-data:
  # Volumenes NOMBRADOS: son lo que hace portable el plano central.
  clickhouse-data:
  vm-data:
  collector-queue:
  langfuse-postgres:
  langfuse-redis:
  langfuse-minio:
  temporal-postgres:
