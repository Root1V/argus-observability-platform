# Reglas del CAMINO TEMPLADO (2-15 s).
#
# El camino caliente NO pasa por aqui: va directo del Collector agente al
# alert-bus. Aqui viven las condiciones que necesitan una ventana para tener
# sentido, no las que se ven en un solo evento.
groups:
  - name: argus.slo
    interval: 10s
    rules:
      # Burn-rate multi-ventana, no umbrales estaticos. Corta Y larga tienen
      # que superar el umbral a la vez para paginar: es lo que evita despertar
      # a alguien por un pico de treinta segundos.
      - record: argus:error_ratio:rate5m
        expr: |
          sum by (service_namespace, service_name) (rate(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR"}[5m]))
          /
          clamp_min(sum by (service_namespace, service_name) (rate(traces_span_metrics_calls_total[5m])), 0.001)

      - record: argus:error_ratio:rate1h
        expr: |
          sum by (service_namespace, service_name) (rate(traces_span_metrics_calls_total{status_code="STATUS_CODE_ERROR"}[1h]))
          /
          clamp_min(sum by (service_namespace, service_name) (rate(traces_span_metrics_calls_total[1h])), 0.001)

      - alert: ArgusSLOBurnRateFast
        # 14.4x consume el presupuesto mensual en unos dos dias.
        expr: argus:error_ratio:rate5m > 0.144 and argus:error_ratio:rate1h > 0.144
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.service_namespace }}/{{ $labels.service_name }}: quema rapida del presupuesto de error"

      - alert: ArgusSLOBurnRateSlow
        expr: argus:error_ratio:rate1h > 0.03
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.service_namespace }}/{{ $labels.service_name }}: quema lenta del presupuesto de error"

  # El grupo argus.platform vivia aqui con dos reglas que NUNCA pudieron
  # disparar: estaban escritas contra `otelcol_exporter_send_failed_spans` y
  # `otelcol_processor_dropped_spans`, nombres que no existen — los reales
  # llevan sufijo `_total`. Una regla contra una metrica inexistente no da
  # error: se queda en "sin datos", que se parece muchisimo a "todo bien".
  # Sustituidas por platform/rules/plataforma.yaml (D-079).
