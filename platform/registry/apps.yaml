# Registro de aplicaciones.
#
# Fuente de verdad de DOS cosas que sin el no funcionan:
#   - la correlacion de alertas, que necesita `depende_de` para suprimir
#     sintomas cuando ya hay una causa aguas arriba;
#   - el enrutamiento de notificaciones, que es una REGLA y no un juicio.
#
# Es datos, no codigo: anadir una aplicacion no reinicia nada. Y un servicio que
# empiece a emitir sin estar aqui aparecera igualmente como `provisional`, con
# un aviso de baja severidad.
#
# `criticidad` acota la severidad maxima:
#   alta -> puede paginar · media -> como mucho ticket · baja -> solo digest
#
# `estado` decide si el canario la vigila:
#   activo      -> emite telemetria HOY; su silencio es un incidente
#   planificado -> esta en el roadmap pero aun no instrumentada; NO se vigila
#   retirado    -> ya no existe
#
# La distincion importa mas de lo que parece. Marcar como `activo` una
# aplicacion que todavia no emite hace que el canario la reporte como
# silenciosa cada cinco minutos, y un canario que grita por cosas que sabes que
# no estan es un canario que se silencia. El registro puede listar el
# portafolio ENTERO como hoja de ruta; solo lo `activo` genera guardias.

- id: argus
  nombre_visible: Argus (la propia plataforma)
  estado: activo
  criticidad: alta
  dueño: emeric
  canales:
    page: [gchat, email, console]   # los no configurados se omiten
    ticket: [gchat, console]
  componentes:
    # `notifier` NO esta aqui: los canales son sinks en proceso dentro del
    # alert-bus, no un servicio aparte (D-029).
    - {id: alert-bus, rol: api, slo: {p95_ms: 1000}}
    - {id: canary, rol: scheduler}
  depende_de: [clickhouse, victoriametrics]

- id: intelligent-document-platform
  # Planificada: esta en el roadmap (F1-11, F7-02) pero aun no emite.
  nombre_visible: IDP
  estado: planificado
  criticidad: alta
  dueño: emeric
  canales:
    page: [console]
    ticket: [console]
  componentes:
    - {id: idp-api, rol: api, slo: {p95_ms: 8000}}
    - {id: idp-worker, rol: worker}
    - {id: idp-ocr, rol: model-server, slo: {p95_ms: 30000}}
  depende_de: [postgres-main, minio-main]
  tipo_ia: [llm-api, ocr, extraccion-estructurada]

# OJO con el nombre: el proyecto se llama **Prometheus** (plataforma de
# inferencia local de nivel empresarial) y `edge-ai-inference` es solo su
# carpeta. No tiene NADA que ver con Prometheus-el-TSDB, que aparece por otro
# lado en esta plataforma (PromQL, prometheusremotewrite, VictoriaMetrics).
# El `id` conserva el nombre del directorio porque es lo que emiten sus
# servicios hoy en `service.namespace`; cambiarlo seria cambiar su
# configuracion, y eso es suyo.
- id: edge-ai-inference
  nombre_visible: Prometheus (inferencia local)
  # APLICACION PILOTO, a la espera de su equipo.
  #
  # `auth-service` ya emite trazas hacia nuestro Collector con solo variables de
  # entorno, pero llegan bajo `unregistered`: su `configure_tracing` construye el
  # Resource con el constructor directo, que descarta OTEL_RESOURCE_ATTRIBUTES.
  #
  # Pasa a `activo` cuando apliquen el cambio de una linea que les pedimos en
  # docs/solicitudes/prometheus-resource-create.md. Marcarlo activo antes
  # haria que el canario reportase silencio de algo que si emite, pero con otra
  # identidad.
  estado: planificado
  criticidad: alta
  dueño: emeric
  canales:
    page: [console]
    ticket: [console]
  componentes:
    # Conectado. Un servicio de autenticacion tiene que ser rapido: si tarda,
    # todo lo que hay detras tarda.
    - {id: auth-service, rol: api, slo: {p95_ms: 1000}}
    # Pendientes de conectar.
    - {id: gateway, rol: api, slo: {p95_ms: 30000}}
    - {id: manager-api, rol: api, slo: {p95_ms: 2000}}
    - {id: manager-core, rol: scheduler}
  depende_de: [redis-main]
  tipo_ia: [llm-local]

- id: aeon-ai
  # Planificada: esta en el roadmap (F1-11, F7-02) pero aun no emite.
  estado: planificado
  criticidad: media
  dueño: emeric
  canales:
    page: [console]
    ticket: [console]
  componentes:
    - {id: control-plane, rol: api}
    - {id: modelgw, rol: api}
    - {id: toolgw, rol: api}
    - {id: worker, rol: worker}
  depende_de: [postgres-main, temporal]
  tipo_ia: [agentes, llm-local]

# Los laboratorios van con criticidad baja a proposito: un experimento no puede
# generar guardias por mucho que falle.
- id: llm-benchmark
  # Planificada: esta en el roadmap (F1-11, F7-02) pero aun no emite.
  estado: planificado
  criticidad: baja
  componentes:
    - {id: bench-runner, rol: cli}

# Infraestructura compartida. Esta aqui por DOS motivos:
#   - para que `depende_de` pueda apuntar a algo y la correlacion tenga grafo;
#   - para poder vigilarla con sondas HTTP (ver probes.yaml).
#
# Rol `infra`: no emite telemetria propia a nuestro Collector, asi que una
# sonda de SILENCIO sobre ella daria falso positivo siempre. Se vigila por
# sonda HTTP, que es lo que corresponde a algo que no instrumentas.
- id: postgres-main
  estado: activo
  criticidad: alta
  componentes: [{id: postgres-main, rol: infra}]

- id: redis-main
  estado: activo
  criticidad: media
  componentes: [{id: redis-main, rol: infra}]

- id: minio-main
  estado: activo
  criticidad: media
  componentes: [{id: minio-main, rol: infra}]

- id: clickhouse
  estado: activo
  criticidad: alta
  componentes: [{id: clickhouse, rol: infra}]

- id: victoriametrics
  estado: activo
  criticidad: media
  componentes: [{id: victoriametrics, rol: infra}]

- id: temporal
  estado: activo
  criticidad: media
  componentes: [{id: temporal, rol: infra}]
