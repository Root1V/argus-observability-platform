# Registro de aplicaciones.
#
# Fuente de verdad de DOS cosas que sin el no funcionan:
#   - la correlacion de alertas, que necesita `depende_de` para suprimir
#     sintomas cuando ya hay una causa aguas arriba;
#   - el enrutamiento de notificaciones, que es una REGLA y no un juicio.
#
# Es datos, no codigo: anadir una aplicacion no reinicia nada. Y un servicio que
# empiece a emitir sin estar aqui aparecera igualmente como `provisional`, con
# un aviso de baja severidad.
#
# `criticidad` acota la severidad maxima:
#   alta -> puede paginar · media -> como mucho ticket · baja -> solo digest
#
# `estado` decide si el canario la vigila:
#   activo      -> emite telemetria HOY; su silencio es un incidente
#   planificado -> esta en el roadmap pero aun no instrumentada; NO se vigila
#   retirado    -> ya no existe
#
# La distincion importa mas de lo que parece. Marcar como `activo` una
# aplicacion que todavia no emite hace que el canario la reporte como
# silenciosa cada cinco minutos, y un canario que grita por cosas que sabes que
# no estan es un canario que se silencia. El registro puede listar el
# portafolio ENTERO como hoja de ruta; solo lo `activo` genera guardias.

- id: argus
  nombre_visible: Argus (la propia plataforma)
  estado: activo
  criticidad: alta
  dueño: emeric
  canales:
    page: [telegram, gchat, email, console]   # los no configurados se omiten
    ticket: [telegram, gchat, console]
  componentes:
    # `notifier` NO esta aqui: los canales son sinks en proceso dentro del
    # alert-bus, no un servicio aparte (D-029).
    - {id: alert-bus, rol: api, slo: {p95_ms: 1000}}
    - {id: canary, rol: scheduler}
    # Los dos Collector, con rol `infra` a proposito.
    #
    # Estan aqui porque sus alertas tienen que resolver identidad: sin una
    # entrada en el registro, un incidente suyo llega como `unregistered`, la
    # criticidad cae al minimo y un `page` se recorta a `ticket`. Es lo que
    # estaba pasando con las reglas de D-079 y D-087 (D-089).
    #
    # Y con rol `infra` porque `ROLES_SIN_LATIDO` lo excluye de la sonda de
    # silencio del canario: su ausencia ya la vigilan `ArgusAgenteSinAutoMetricas`
    # y `ArgusGatewaySinAutoMetricas`, que ademas saben distinguir "callado" de
    # "el observador acaba de despertar". Dos vigilantes sobre lo mismo son dos
    # avisos por incidente.
    - {id: collector-agent, rol: infra}
    - {id: collector-gateway, rol: infra}
  depende_de: [clickhouse, victoriametrics]

- id: veritium
  # El rediseño de lo que aqui se llamaba `intelligent-document-platform`. Su
  # equipo eligio el nombre, y el namespace que emiten es `veritium`.
  #
  # SIN alias del nombre viejo, a diferencia de Prometheus: `edge-ai-inference`
  # habia estado emitiendo y el alias evitaba que su trafico entrara como
  # `provisional` durante la ventana. Aqui se comprobo primero —cero spans con
  # `intelligent-document-platform` en todo el historico— asi que un alias
  # seria una entrada que no protege de nada y que alguien tendria que retirar.
  nombre_visible: Veritium
  # ACTIVO desde el 14/10, y en este orden: cablearon, lo verificamos en el
  # almacen, y entonces se paso. `activo` enciende la sonda de silencio, asi
  # que declararlo antes habria generado un incidente cada cinco minutos.
  estado: activo
  criticidad: alta
  dueño: emeric
  # TELEGRAM DESACTIVADO el 14/10 a peticion del dueño de la plataforma.
  #
  # Motivo: 335 notificaciones por UN solo error suyo —un `NotNullViolationError`
  # con la columna `tenant` a null en `webhook_deliveries`— que saturaron el
  # canal humano. Y la causa de que fueran 335 y no UNA es NUESTRA: el
  # `alert-bus` construia la firma con el mensaje de error completo, que incluye
  # la linea `DETAIL:` de Postgres con los UUID de la fila y su timestamp. Cada
  # ocurrencia, una firma distinta. Ver D-118.
  #
  # Se deja en `console` y NO se baja a `provisional`: la deteccion sigue
  # entera, los incidentes se siguen registrando, y lo unico que se apaga es
  # despertar a una persona. Silenciar y dejar de mirar son cosas distintas.
  #
  # SE REACTIVA cuando: (1) su equipo arregle el `tenant` null, y (2) se
  # verifique en el almacen que el error ya no llega. No antes.
  # TELEGRAM REACTIVADO el 15/10, cumplidas las dos condiciones que se
  # escribieron al apagarlo:
  #
  #   1. Veritium arreglo la causa. No era su codigo actual: era un proceso
  #      VIEJO. Migraron `webhook_deliveries` exigiendo `tenant` a las 11:03 y
  #      la API seguia corriendo con el codigo anterior, insertando cada 2 s
  #      sin ese campo. La reiniciaron a las 11:32 — que es exactamente el
  #      final de la ventana que medimos desde aqui.
  #
  #   2. 26 horas limpias, medidas: ultimo error el 14/10 a las 11:32:43, cero
  #      ocurrencias en 24 h. Y con 107.191 spans en 25 horas distintas, asi
  #      que las 24 h significan algo — 24 horas limpias sin trafico no habrian
  #      probado nada.
  #
  # La causa de que fueran 335 avisos y no UNO era nuestra (D-118) y tambien
  # esta arreglada, asi que una reaparicion ya no satura el canal.
  canales:
    page: [telegram, console]
    ticket: [telegram, console]
  componentes:
    # Verificado en `otel.otel_traces` antes de activar: namespace `veritium`,
    # rol y entorno correctos en los dos.
    #
    # El SLO sale de MEDIR y no de suponer: el `POST .../reprocess` encola y
    # vuelve en 77 ms —el trabajo de 16,6 s se lo lleva el worker— asi que el
    # p95 de la API es de centenares de milisegundos, no de los 8000 que
    # heredaba de `idp-api`. Un SLO diez veces mas flojo de lo necesario no
    # avisa de nada.
    - {id: veritium-api, rol: api, slo: {p95_ms: 1000}}
    # `latido: false` porque lo pidieron y el motivo es correcto: los casos
    # llegan a rafagas, asi que un worker callado es operacion normal. Apaga la
    # sonda de silencio y NO le quita nada mas — criticidad, canales y runbook
    # siguen igual. Es el mismo caso que Prosodia.
    - {id: veritium-worker, rol: worker, latido: false}
    #
    # `idp-ocr` RETIRADO a peticion suya: el OCR es una libreria que importan la
    # API y el worker, sin punto de entrada propio, asi que sus spans salen bajo
    # la identidad de quien la importa. Un componente es un proceso desplegable
    # por separado; una libreria declarada aqui es esperar para siempre una
    # conexion que no puede ocurrir. Es exactamente lo que Prometheus nos pidio
    # con `manager-core` (P-05).
  # Lo que consumen, segun su propio contexto en el canal compartido. Alimenta
  # la supresion de alertas sintoma: si aeon o la inferencia caen, lo de
  # Veritium es consecuencia y no causa.
  depende_de: [aeon-ai, prometheus-inference-platform, postgres-main, minio-main]
  tipo_ia: [llm-api, ocr, extraccion-estructurada]

# APLICACION PILOTO. El nombre lo eligio su equipo el 13/09/2026:
# `prometheus-inference-platform`, y NO `prometheus` a secas, porque un
# namespace llamado «prometheus» dentro de una plataforma de observabilidad se
# confunde con Prometheus-el-TSDB —que aparece por otro lado aqui: PromQL,
# prometheusremotewrite, VictoriaMetrics— en consultas, en enrutado y en la
# cabeza de quien este de guardia. `edge-ai-inference` era el nombre de su
# carpeta, no el del producto.
- id: prometheus-inference-platform
  nombre_visible: Prometheus (inferencia local)
  # El namespace viejo sigue llegando hasta que redesplieguen. El alias evita
  # que ese trafico entre como `provisional` y pierda criticidad, canales y
  # runbook durante la ventana. Se retira cuando deje de aparecer.
  alias: [edge-ai-inference]
  #
  # Su equipo aplico `Resource.create()` (S-01) y ADEMAS retiro su pila propia
  # —Loki, Promtail, Tempo, su Grafana—. Consecuencia que nos toca a nosotros:
  # ya no hay colector por defecto, asi que **sin OTEL_EXPORTER_OTLP_ENDPOINT no
  # exportan nada, en silencio**. Somos el unico destino y no hay red debajo.
  # Por eso pasa a `activo`: el canario trata el silencio como sintoma, que es
  # justo lo que hace falta ahora (D-046).
  estado: activo
  criticidad: alta
  dueño: emeric
  canales:
    page: [telegram, gchat, email, console]
    ticket: [telegram, gchat, console]
  componentes:
    # Conectado. Un servicio de autenticacion tiene que ser rapido: si tarda,
    # todo lo que hay detras tarda.
    - {id: auth-service, rol: api, slo: {p95_ms: 1000}}
    # Conectados el 13/09 (P-06). Verificado en el almacen antes de encender la
    # sonda: namespace, `service.name`, rol y entorno correctos en los tres.
    - {id: gateway, rol: api, slo: {p95_ms: 30000}}
    - {id: manager-api, rol: api, slo: {p95_ms: 2000}}
    # La interfaz de terminal. Declarada para que no entre como desconocida, y
    # con rol `cli` para que NO se le vigile el silencio: es una sesion
    # interactiva de una persona, no un servicio. Que calle es lo normal.
    #
    # Existe porque compartia identidad con `manager-api` (P-04): dos procesos
    # bajo el nombre `manager`, asi que un desarrollador con la TUI abierta
    # mantenia vivo el aspecto de una API muerta. Lo encontro su equipo al
    # revisar por que estos componentes no emitian.
    - {id: manager-tui, rol: cli}
    # `text-embeddings-inference`, cuatro instancias en el nodo `lab`: un
    # reranker, embeddings, NLI y clasificacion. Lo avisaron en P-37 §4 y HOY
    # NO EMITE NADA: tiene `--otlp-endpoint` y puerto Prometheus, los dos sin
    # conectar.
    #
    # Declarado en `planificado` y no en `activo` a proposito: `activo`
    # enciende la sonda de silencio, y un componente que todavia no esta
    # cableado gritaria cada cinco minutos por algo sabido (D-094). Pasa a
    # `activo` cuando confirmen el cableado y veamos sus spans.
    #
    # UN SOLO `service.name` para las cuatro instancias, no cuatro. Es la
    # decision de D-062 aplicada: el modelo servido es una DIMENSION
    # (`gen_ai.request.model`), no un nombre de servicio — si cada modelo
    # fuera un servicio, los alias partirian los paneles y "como esta TEI"
    # dejaria de ser una pregunta. Las instancias se separan con
    # `service.instance.id`.
    #
    # SLO MEDIDO por su equipo (P-42 §2), no supuesto. Mis 2000 ms eran una
    # suposicion y ellos la tumbaron con el argumento correcto: con ese umbral,
    # el reranker tendria que degradarse 6x para disparar.
    #
    # LA CARGA DE REFERENCIA VA CON EL NUMERO, porque sin ella el umbral no
    # significa nada: la latencia de un reranker la manda el NUMERO DE
    # DOCUMENTOS, no la peticion. Medido contra TEI directamente, sin su
    # gateway en medio y con la maquina tranquila:
    #
    #    1 doc   (65 tok)      p95   15,7 ms
    #   10 docs  (690 tok)     p95   61,8 ms
    #   50 docs  (3.443 tok)   p95  340,3 ms
    #
    # ~6,5 ms por documento mas ~9 ms fijos. Lineal.
    #
    # El trafico real de rerank de su plataforma —597 llamadas— da p50 de 1.976
    # tokens y p95 de 2.652. A esa carga, el p95 de TEI esta en ~340 ms. Los
    # 500 dejan 1,4x de margen: disparan ante una degradacion de verdad y no
    # ante ruido. Por debajo de 400 avisaria por tamano de lote y no por salud.
    #
    # SIGUE EN `planificado`: el 15/10 dicen que lo cablearon y en el almacen no
    # hay NI UN span de `tei`, mientras sus otros tres servicios emiten a la vez.
    # Pasa a `activo` cuando los veamos, que es el mismo orden de siempre.
    - {id: tei, rol: model-server, slo: {p95_ms: 500}}
    # `manager-core` NO esta aqui, a peticion suya (P-05): es una libreria que
    # importan `manager-api` y la TUI, sin punto de entrada propio. No puede
    # emitir como servicio ni ahora ni nunca; sus spans salen bajo la identidad
    # de quien la importa. Tenerla en `planificado` era esperar una conexion
    # que no iba a llegar.
  depende_de: [redis-main]
  tipo_ia: [llm-local]

- id: prosodia
  # Integrada de verdad el 28/09: doblaje real de 462,9 s, traza entera de la
  # API al worker cruzando Celery, y 61 de 67 registros correlacionados (S-06).
  #
  # Estaba entrando como `provisional` por auto-descubrimiento, y eso la dejaba
  # DOBLEMENTE muda: `provisional` fuerza criticidad `media` —techo `ticket`— y
  # sin `canales` declarados el enrutamiento cae al `["console"]` por defecto.
  # Un fallo suyo se escribia en el log del alert-bus y en ningun sitio mas.
  # Es el mismo modo de fallo de D-089 con otra causa: la alerta funciona, la
  # entrega no.
  nombre_visible: Prosodia (doblaje de video)
  estado: activo
  criticidad: media
  dueño: emeric
  canales:
    # `media` topa en `ticket`, asi que `page` no se puede alcanzar hoy. Se
    # declara igual para que subir la criticidad no exija recordar esto.
    page: [telegram, console]
    ticket: [telegram, console]
  componentes:
    # La API cierra en milisegundos; el SLO que importa es el del worker, y su
    # unidad no es la peticion sino el doblaje. 21 minutos medidos en un clip
    # largo, 463 s en uno de dos minutos: el umbral se pone sobre el peor caso
    # observado con holgura, no sobre la media.
    #
    # `latido: false` en los dos: Prosodia es un pipeline que alguien LANZA,
    # no un servicio que corre. Esta callada la mayor parte del dia y eso es
    # lo normal — al comprobarlo llevaba 56 minutos sin emitir, con todo
    # funcionando. La sonda de silencio gritaria cada cinco minutos por algo
    # sabido, y ahora que sus avisos llegan a Telegram gritaria a una persona.
    #
    # Lo que habria que vigilar aqui es un doblaje que empieza y no termina.
    # Es otra sonda y no existe: F2-16.
    - {id: prosodia-api, rol: api, latido: false, slo: {p95_ms: 2000}}
    - {id: prosodia-worker, rol: worker, latido: false, slo: {p95_ms: 1800000}}
  depende_de: [redis-main]
  tipo_ia: [asr, diarizacion, traduccion, tts]

- id: aeon-ai
  # DOS ENTRADAS, y las pidieron ellos (`AEON-SYN-001`, respondiendo a
  # `ARG-AEON-005`). Esta es el stack de DESARROLLO, que es el unico que nos
  # apunta hoy.
  #
  # Lo que lo decidio es un dato suyo que yo no tenia: **no existe produccion de
  # aeon**. Su `deploy/` solo tiene compose, `deploy/helm` lleva meses siendo un
  # directorio vacio, y su colector apunta por defecto a su Tempo local — asi
  # que alcanzarnos exige poner `ARGUS_ENDPOINT` a mano.
  #
  # Yo habia medido «12 dias sin emitir» y lo presente como un hecho sobre
  # aeon. Era un hecho sobre QUE ME LLEGA: sus suites emiten mucho y son
  # invisibles aqui por diseño. Su silencio es RUIDO, no sintoma, y lo que
  # sobraba era mi expectativa.
  #
  # Antes esta entrada mezclaba las dos cosas: el `activo` describia un
  # despliegue y el `latido: false` otro.
  nombre_visible: aeon (desarrollo)
  estado: activo
  criticidad: media
  dueño: emeric
  canales:
    page: [telegram, console]
    ticket: [telegram, console]
  componentes:
    # `latido: false` en los cinco, y AHORA SI es lo que piden.
    #
    # El 29/09 dijeron «corren siempre, sin `latido: false` — si uno se calla,
    # es una noticia», y lo puse en false al reves de lo que pedian. Hoy dicen
    # que esa frase describia PRODUCCION y que la escribieron antes de saber que
    # no la habria todavia: aplicarla a un stack que esta caido la mayor parte
    # del tiempo «convertiria la sonda en algo que nadie mira, que es peor que
    # no tenerla».
    #
    # Asi que la configuracion no cambia y el motivo si: ya no es una decision
    # mia a su pesar, es la suya.
    - {id: control-plane, rol: api, latido: false}
    - {id: modelgw, rol: api, latido: false}
    - {id: toolgw, rol: api, latido: false}
    - {id: runcontroller, rol: api, latido: false}
    - {id: worker, rol: worker, latido: false}
  depende_de: [postgres-main, temporal]
  tipo_ia: [agentes, llm-local]

- id: aeon-ai-prod
  # PRODUCCION, que hoy NO EXISTE. Declarada en `planificado` para que el dia
  # que exista no entre como `provisional` —que fuerza criticidad media y pierde
  # canales y runbook (D-094)— y para que la decision del latido este tomada de
  # antemano y no en caliente.
  #
  # `latido: true` desde el primer dia, que es la frase que ellos escribieron el
  # 29/09 y que aqui si aplica: **si uno se calla, es una noticia**.
  #
  # Avisan ellos cuando exista. Ese es tambien el momento de decidir si `B-29`
  # —que la sonda distinga por entorno— sigue haciendo falta o si estas dos
  # entradas ya lo resuelven.
  nombre_visible: aeon (produccion)
  estado: planificado
  criticidad: alta
  dueño: emeric
  canales:
    page: [telegram, console]
    ticket: [telegram, console]
  componentes:
    - {id: control-plane, rol: api}
    - {id: modelgw, rol: api}
    - {id: toolgw, rol: api}
    - {id: runcontroller, rol: api}
    - {id: worker, rol: worker}
  depende_de: [postgres-main, temporal]
  tipo_ia: [agentes, llm-local]

- id: llm-benchmark
  # Planificada: esta en el roadmap (F1-11, F7-02) pero aun no emite.
  estado: planificado
  criticidad: baja
  componentes:
    - {id: bench-runner, rol: cli}

# Infraestructura compartida. Esta aqui por DOS motivos:
#   - para que `depende_de` pueda apuntar a algo y la correlacion tenga grafo;
#   - para poder vigilarla con sondas HTTP (ver probes.yaml).
#
# Rol `infra`: no emite telemetria propia a nuestro Collector, asi que una
# sonda de SILENCIO sobre ella daria falso positivo siempre. Se vigila por
# sonda HTTP, que es lo que corresponde a algo que no instrumentas.
#
# LLEVAN CANALES, y no los llevaban. Se anadieron aqui para que `depende_de`
# tuviera grafo y para poder sondearlas, y nadie penso en el enrutamiento: con
# `canales` vacio, `channels_for` cae al `["console"]` por defecto. ClickHouse
# esta declarada `alta`, tiene sonda HTTP en `probes.yaml`, y su caida —que deja
# a la plataforma entera sin almacen— se escribia en un log y en ningun sitio
# mas (D-094).
- id: postgres-main
  estado: activo
  criticidad: alta
  canales:
    page: [telegram, console]
    ticket: [telegram, console]
  componentes: [{id: postgres-main, rol: infra}]

- id: redis-main
  estado: activo
  criticidad: media
  canales:
    ticket: [telegram, console]
  componentes: [{id: redis-main, rol: infra}]

- id: minio-main
  estado: activo
  criticidad: media
  canales:
    ticket: [telegram, console]
  componentes: [{id: minio-main, rol: infra}]

- id: clickhouse
  estado: activo
  criticidad: alta
  canales:
    page: [telegram, console]
    ticket: [telegram, console]
  componentes: [{id: clickhouse, rol: infra}]

- id: victoriametrics
  estado: activo
  criticidad: media
  canales:
    ticket: [telegram, console]
  componentes: [{id: victoriametrics, rol: infra}]

- id: temporal
  estado: activo
  criticidad: media
  canales:
    ticket: [telegram, console]
  componentes: [{id: temporal, rol: infra}]
