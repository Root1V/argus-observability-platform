[project]
name = "argus-platform"
version = "0.1.0"
description = "Argus — plataforma de observabilidad, AIOps agentico y explicabilidad"
requires-python = ">=3.11"
dependencies = [
    "argus-obs-semconv",
    "argus-obs-sdk",
    "argus-obs-schemas",
    "alert-bus",
    "canary",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "pyyaml>=6",
    "ruff>=0.6",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
]

[tool.uv.workspace]
members = ["libs/argus-semconv", "libs/argus-sdk", "libs/argus-schemas", "services/alert-bus", "services/canary"]

[tool.uv.sources]
argus-obs-semconv = { workspace = true }
argus-obs-sdk = { workspace = true }
argus-obs-schemas = { workspace = true }
alert-bus = { workspace = true }
canary = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = [
    "libs/argus-semconv/tests",
    "libs/argus-sdk/tests",
    "libs/argus-schemas/tests",
    "services/alert-bus/tests",
    "services/canary/tests",
    # El vigilante NO es un servicio y por eso se quedo fuera de la lista al
    # principio. Sus tests estuvieron escritos y sin ejecutarse hasta que se
    # conto: un guardarrail que no corre es un fichero de texto (D-088).
    "deadman/tests",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::RuntimeWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# BLE esta incluido a proposito: capturar Exception a ciegas es exactamente lo
# que este SDK hace en los caminos de telemetria, y queremos que cada sitio
# donde ocurre lleve su `# noqa: BLE001` con el motivo escrito al lado. Sin BLE
# en la lista, esos noqa serian decorativos y nadie los mantendria.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = [
    "E501",
    # __all__ agrupado por concepto y comentado se lee mejor que alfabetico.
    "RUF022",
    # `contextlib.suppress` anade una llamada por invocacion. En el camino
    # caliente de la telemetria preferimos el try/except explicito.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"libs/argus-semconv/src/argus_semconv/attributes.py" = ["E501", "RUF"]
"**/tests/**" = ["B011", "SIM117"]
# En los ejemplos el `with` anidado es pedagogico: muestra la jerarquia
# agente -> paso -> llamada, que es justo lo que el lector tiene que ver.
"examples/**" = ["SIM117"]
# El dead man's switch corre con el Python del SISTEMA, que en este Mac es el
# 3.9.6 de Xcode, porque launchd invoca /usr/bin/python3. `target-version =
# py311` le hizo "modernizar" `timezone.utc` a `datetime.UTC` —que no existe en
# 3.9— y el vigilante llevaba desde entonces reventando en cada ejecucion con un
# ImportError que solo se veia en /tmp/argus-deadman.err (D-088).
#
# UP es justo el grupo que asume la version del proyecto, y este fichero no la
# tiene: su requisito es correr en cualquier Python que haya, porque si
# dependiera de uno instalado compartiria modos de fallo con lo que vigila.
"deadman/**" = ["UP"]
