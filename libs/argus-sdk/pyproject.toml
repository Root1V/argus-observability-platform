[project]
name = "argus-sdk"
version = "1.0.0"
description = "SDK de observabilidad de Argus. Para APLICACIONES: configura trazas, metricas y logs con una linea."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Nucleo deliberadamente pequeño. Un Temporal activity o un CLI no deben
# arrastrar Starlette, y una app que no habla con Kafka no debe instalar su
# instrumentacion. Todo lo demas va en extras.
dependencies = [
    "argus-semconv>=1.0,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
]

[project.optional-dependencies]
http     = ["opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
asgi     = ["opentelemetry-instrumentation-asgi>=0.51b0", "opentelemetry-instrumentation-fastapi>=0.51b0"]
client   = ["opentelemetry-instrumentation-httpx>=0.51b0", "opentelemetry-instrumentation-requests>=0.51b0"]
sql      = ["opentelemetry-instrumentation-sqlalchemy>=0.51b0", "opentelemetry-instrumentation-asyncpg>=0.51b0"]
redis    = ["opentelemetry-instrumentation-redis>=0.51b0"]
celery   = ["opentelemetry-instrumentation-celery>=0.51b0"]
kafka    = ["opentelemetry-instrumentation-aiokafka>=0.51b0"]
logging  = ["structlog>=25.1"]
genai    = ["openlit>=1.34"]
all      = ["argus-sdk[http,asgi,client,sql,redis,celery,kafka,logging]"]
dev      = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "starlette>=0.37", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.hatch.metadata]
allow-direct-references = true
