[project]
name = "argus-schemas"
version = "1.0.0"
description = "Esquemas compartidos de Argus: senal, incidente, severidad."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "argus-semconv>=1.0,<2",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_schemas"]
