[project]
name = "argus-obs-schemas"
version = "1.0.0a2"
description = "Esquemas compartidos de Argus: senal, incidente, severidad."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emeric Espiritu" }]
keywords = ["observability", "schemas", "incidents", "alerting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "argus-obs-semconv>=1.0.0a2,<2",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_schemas"]

# Quien encuentre esto en PyPI tiene derecho a saber de donde sale y donde
# reportar. Un paquete sin origen publico es la misma opacidad de cadena de
# suministro que nos objeto un equipo consumidor (D-075).
[project.urls]
Homepage = "https://github.com/Root1V/argus-obs"
Repository = "https://github.com/Root1V/argus-obs"
Issues = "https://github.com/Root1V/argus-obs/issues"
