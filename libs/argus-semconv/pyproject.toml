[project]
name = "argus-obs-semconv"
version = "1.0.0a6"
description = "Convenciones semanticas de Argus. Para LIBRERIAS: depende solo de la API de OpenTelemetry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emeric Espiritu" }]
keywords = ["observability", "opentelemetry", "semantic-conventions", "genai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

# ATENCION: esta lista de dependencias es un contrato, no un detalle.
#
# Este paquete lo importan LIBRERIAS (Axonium, synaptum, ...), no aplicaciones.
# Una libreria que depende del SDK impone en silencio su version del SDK y sus
# opiniones sobre exportadores a TODO el que dependa de ella. Con quince o mas
# aplicaciones importando Axonium, eso es un infierno de dependencias.
#
# Por eso: SOLO la API, y con rango abierto dentro de la mayor. NUNCA una
# version exacta, NUNCA el SDK, NUNCA un exportador.
dependencies = [
    "opentelemetry-api>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "opentelemetry-sdk>=1.30,<2", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_semconv"]

# Quien encuentre esto en PyPI tiene derecho a saber de donde sale y donde
# reportar. Un paquete sin origen publico es la misma opacidad de cadena de
# suministro que nos objeto un equipo consumidor (D-075).
[project.urls]
Homepage = "https://github.com/Root1V/argus-observability-platform"
Repository = "https://github.com/Root1V/argus-observability-platform"
Issues = "https://github.com/Root1V/argus-observability-platform/issues"
